<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TenderAI - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 flex flex-col items-center">
    <div class="w-full max-w-3xl space-y-6">
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold">TenderAI Client Portal</h1>
            <a href="/logout" class="text-sm text-red-400 hover:underline">Logout</a>
        </div>

        <!-- Upload Form -->
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl">
            <form id="tenderForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Upload Tender PDF</label>
                    <input type="file" id="pdfFile" accept=".pdf" required class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer bg-gray-900 border border-gray-700 rounded-lg">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-lg">Analyze Tender</button>
            </form>
        </div>

        <!-- Results Card (Hidden Initially) -->
        <div id="resultsCard" class="hidden bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl space-y-4">
            <h2 id="resProjectName" class="text-2xl font-bold text-white"></h2>
            <p class="text-amber-400 font-medium">Deadline: <span id="resDeadline" class="text-gray-200"></span></p>
            <div>
                <h3 class="text-sm font-semibold uppercase text-red-400">Penalties</h3>
                <ul id="resPenalties" class="list-disc list-inside text-sm text-gray-300 mt-1"></ul>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('tenderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('pdfFile');
            const submitBtn = document.getElementById('submitBtn');
            const resultsCard = document.getElementById('resultsCard');

            if (!fileInput.files[0]) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            submitBtn.textContent = "Analyzing Document...";
            submitBtn.disabled = true;

            try {
                const response = await fetch('/analyze', { method: 'POST', body: formData });
                const data = await response.json();

                document.getElementById('resProjectName').textContent = data.project_name;
                document.getElementById('resDeadline').textContent = data.submission_deadline;
                
                const penaltiesList = document.getElementById('resPenalties');
                penaltiesList.innerHTML = '';
                data.penalty_clauses.forEach(clause => {
                    const li = document.createElement('li');
                    li.textContent = clause;
                    penaltiesList.appendChild(li);
                });

                resultsCard.classList.remove('hidden');
            } catch (err) {
                alert("Error analyzing tender.");
            } finally {
                submitBtn.textContent = "Analyze Tender";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
